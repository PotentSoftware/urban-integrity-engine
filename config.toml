# ═══════════════════════════════════════════════════════════════════════════════════════
# UrbanIntegrity — EXAMPLE configuration
#
# Everything place-specific in this file is FICTIONAL: the analysis database, the planning
# portals (commented out below), the ONS codes and the postcode districts. It loads as-is and
# is enough for the toy analysis (scripts/toy-analysis.sh), which reads its wards from the
# fixture rather than from here.
#
# For a real analysis, do not edit this file. Copy it and edit the copy:
#
#     cp config.toml config.local.toml      # config.local.toml is gitignored
#
# When config.local.toml exists, AppConfig::load() reads it INSTEAD of this file — the two
# are never merged, so the copy must be complete. URBAN__* environment variables still
# override either one (e.g. URBAN__SURREAL__DATABASE). See docs/CONFIGURATION.md.
#
# What to change in your copy:
#   * [surreal] database — the id printed by `urban-integrity-cli analysis create`
#     (format an_<label-slug>_<8 hex>), or `--analysis <id>` on each command instead.
#   * [[ingest.planning_portals]] — one entry per ward. Ward and LPA codes are ONS GSS codes
#     (ward E05/W05/S13/N08…, local authority E06/E07/E08/E09/W06/S12/N09…); look them up in
#     the ONS Open Geography Portal (geoportal.statistics.gov.uk) or the ONS Postcode
#     Directory. The URL is your council's own online planning register — find it from the
#     council's planning web pages, and note which system it runs (portal_type).
#   * [enricher.ppd] postcode_districts — the outward codes covering your LPA.
#   * [detector] imd_csv_path — the deprivation index for your nation (see [detector]).
# Never put API keys in either file; supply them as URBAN__* env vars or in .env.
# ═══════════════════════════════════════════════════════════════════════════════════════
[surreal]
ws_url = "ws://localhost:8000"
namespace = "urban_integrity"
# Fictional analysis id. Replace with your own from `analysis create`.
database = "an_example_00000000"
username = "root"
password = "root"

[graph]
checkpoint_events_n = 1000
checkpoint_interval_secs = 60
checkpoint_path = "data/checkpoints"
wal_channel_capacity = 10000
wal_batch_size = 100
wal_batch_window_ms = 100
shard_count = 64
snapshot_every_n_events = 1000
snapshot_interval_secs = 30

# `urban-integrity-cli workbench` HTTP server bind address (D-05, Phase 42).
# Precedence, lowest to highest: this value, URBAN__WORKBENCH__BIND_ADDR (env), then the
# `workbench --bind <addr>` CLI flag (crates/cli/src/commands/workbench.rs). Never auto-picks a
# port — a taken port is a fail-loud error naming the address.
[workbench]
bind_addr = "127.0.0.1:8090"

[ingest]
# Set via URBAN__INGEST__CH_API_KEY environment variable
ch_api_key = ""
# Set via URBAN__INGEST__FIRECRAWL_API_KEY environment variable
firecrawl_api_key = ""
cf_poll_interval_secs = 900
scrapling_url = "http://localhost"
scrapling_port = 8765
# Per-request timeout for a sidecar /scrape call. A ward re-list is ONE request covering the
# whole ward, so this must clear the slowest ward: measured live 2026-07-27, a 4,986-application
# ward took 157.6s. The former hardcoded 180s timed out under load.
scrapling_timeout_secs = 300

# Planning portal poll interval (seconds) — 1 hour default
planning_poll_interval_secs = 3600

# ─── Planning portals (FICTIONAL EXAMPLES — commented out) ───────────────────────────────
# One [[ingest.planning_portals]] entry per ward. The ward codes are also where the analysis
# NATION comes from (see [jurisdiction] at the end), which is why the examples below stay
# commented out: X06…/X05… are deliberately not real ONS codes, so the startup preflight would
# refuse them as unrecognised. With no entries, `serve` logs "planning poller disabled" and
# `ingest-planning` says no portals are configured — nothing is scraped.
#
#   lpa_code    ONS local authority (LPA) code, optional — e.g. E06…/E07…/E08…/E09…/W06…
#   ward_code   ONS ward code — E05… (England), W05… (Wales), S13… (Scotland), N08… (NI)
#   portal_type "idox" (default; Idox PublicAccess), "arcus" (Arcus Global / Salesforce),
#               "wfs" or "planapi" — passed verbatim to the Scrapling sidecar
#   url         the ward's page on the council's planning register. Arcus registers carry the
#               ward as a query parameter (?ward=<ward name as the register spells it>).
#
# [[ingest.planning_portals]]
# lpa_code    = "X06999001"
# ward_code   = "X05999001"
# portal_type = "idox"
# url         = "https://planning.example.invalid/online-applications/search.do?action=advanced&ward=X05999001"
#
# [[ingest.planning_portals]]
# lpa_code    = "X06999001"
# ward_code   = "X05999002"
# portal_type = "arcus"
# url         = "https://planning.example.invalid/s/register?ward=Example%20North"
#
# [[ingest.planning_portals]]
# lpa_code    = "X06999001"
# ward_code   = "X05999003"
# portal_type = "arcus"
# url         = "https://planning.example.invalid/s/register?ward=Example%20South"

[detector]
phoenix_window_days = 180
phoenix_min_value = 10000.0
# Deprivation weighting for P_c. `data/` is gitignored, so this file does not arrive with a
# clone — REGENERATE IT rather than hunting for it:
#
#   python3 scripts/build_deprivation_ward_index.py --nation wales --lad <W06… code> [...]
#   python3 scripts/build_deprivation_ward_index.py --nation wales --all
#   python3 scripts/build_deprivation_ward_index.py --nation northern-ireland --all
#   python3 scripts/build_deprivation_ward_index.py --nation england --lad <E06…/E07… code> [...]
#
# Each nation writes its own file under data/ — wimd_2019_wards.csv (Wales),
# imd_2019_wards.csv (England), simd_2020_wards.csv (Scotland), nimdm_2017_wards.csv (NI).
# Point imd_csv_path at the one for YOUR analysis's nation; the Welsh path below is only an
# example value.
#
# `--nation` is required. For England, Scotland and Wales it is not sufficient on its own —
# a bare `--nation wales` exits with an error rather than defaulting to anything. Wales takes
# either `--lad <codes>` or `--all`; England and Scotland require `--lad`, since `--all` would
# page the whole national postcode directory. Northern Ireland needs neither (NISRA publishes
# ward ranks directly). (`--all-wales` is not a flag and never was; these lines said otherwise
# until 2026-08-23.)
#
# Until it exists, `serve` logs "IMD index load failed" and alerts carry m_env = 1.0 with a
# null imd_rank — un-weighted, but stated rather than silent.
#
# ONE NATION PER FILE. The UK has four deprivation indices and they are not comparable:
# England IMD 2019 (32,844 LSOAs), Wales WIMD 2019 (1,909 LSOAs), Scotland SIMD 2020 (6,976
# data zones), NI NIMDM 2017 (890 SOAs). All four rank 1 = most deprived, but a rank of 500
# means something different in each, and every publisher says so explicitly. The loader
# rejects a file that splices them, via the `IMD Denominator` column.
#
# That column is load-bearing for a second reason: without it the loader infers the scale
# from the largest rank present, so a regional extract normalises against its own worst ward
# and declares it the least deprived place in the country. Extra columns (ward name, LSOA
# count, rank spread) are audit-only and ignored.
#
# An index from the wrong nation is now REFUSED AT STARTUP rather than warned about mid-run:
# it would load cleanly, match zero wards, and leave the weighting inert while appearing
# configured (see [jurisdiction] below).
imd_csv_path = "data/wimd_2019_wards.csv"

# Daily enrichment interval in seconds — matches CH bulk update cadence.
# Override via URBAN__ENRICHER__ENRICH_INTERVAL_SECS env var.
[enricher]
enrich_interval_secs = 86400

# Companies House enricher adapter configuration (Phase 17, CHA-03).
# The real API key is NEVER committed — supply via env var:
#   URBAN__ENRICHER__CH__API_KEY=your-ch-api-key
# An absent or empty api_key disables the CH enricher adapters gracefully (is_enabled() == false).
[enricher.ch]
api_key = ""

# HM Land Registry "Use Land and Property Data" adapter configuration (Phase 18, PROP-01).
# CCOD (Corporate Ownership of Land: Domestic) bulk CSV — monthly publication cadence.
#
# Registration required at: https://use-land-property-data.service.gov.uk/
# The real API key is NEVER committed — supply via env var:
#   URBAN__ENRICHER__LAND_REGISTRY__API_KEY=your-hmlr-api-key
# An absent or empty api_key disables the CCOD adapter gracefully (D-03; is_enabled() == false).
[enricher.land_registry]
# HMLR Use Land and Property Data API key — set via URBAN__ENRICHER__LAND_REGISTRY__API_KEY
# env var; empty disables the CCOD adapter (D-03).
api_key = ""
# Local directory for downloaded CCOD ZIPs — planner default per D-02.
cache_dir = "data/ccod"
# Days between CCOD re-downloads — monthly HMLR publication cadence, D-01.
ccod_refresh_interval_days = 30

# HM Land Registry OCOD (overseas companies owning UK property) adapter (Phase 22,
# PROP-05/PROP-06). OPS-01: disabled by default until the HMLR licence is signed.
# api_key may be left blank to inherit the shared [enricher.land_registry] key
# (one HMLR account licenses both ccod + ocod) — set via URBAN__ENRICHER__OCOD__API_KEY.
[enricher.ocod]
api_key = ""
# Local directory for downloaded OCOD ZIPs.
cache_dir = "data/ocod"
# Days between OCOD re-downloads — monthly HMLR publication cadence.
ocod_refresh_interval_days = 30

# London Gazette insolvency adapter configuration (PROP-02).
# Public REST API — no API key required. Always enabled.
# max_pass_secs: wall-clock budget per enrichment pass (default 300 ≈ one ~75-fetch batch).
# lookback_days: max look-back when cursor is empty (default 30 days).
# Override via URBAN__ENRICHER__LONDON_GAZETTE__MAX_PASS_SECS / __LOOKBACK_DAYS env vars.
# Raised from the 300 default 2026-08-13: at 300s a pass cleared roughly one
# results page (314-415s observed, overrunning the budget before reaching a
# boundary), so draining a backlog took a pass per page. The cursor is still
# checkpointed at every page/75-fetch boundary, so this stays resumable and
# bounded — it just does more per invocation.
[enricher.london_gazette]
max_pass_secs = 1800
lookback_days = 30

# HM Land Registry Price Paid Data (PPD) adapter configuration (Phase 23, FLIP-01).
# OGL v3 open data — no API key required.
# The 5.1 GB national pp-complete.txt is never targeted.
# Only yearly files (pp-{year}.txt) for the last years_back years are downloaded.
# An LPA-postcode district allowlist filters rows at load time (D-04):
#   - postcode_districts = ["AB1", "AB2"] overrides the dynamic graph derivation.
#   - Absent postcode_districts → derive from existing Location-node postcodes.
# Override via URBAN__ENRICHER__PPD__ENABLED / __YEARS_BACK env vars.
#
# Disabled in this example: the districts below are placeholders, so enabling it unedited
# would download every yearly file and keep nothing. In your config.local.toml set
# enabled = true AND list your own LPA's districts.
[enricher.ppd]
enabled = false
years_back = 5
# cache_dir = "data/ppd"
# Set the allowlist EXPLICITLY rather than letting it derive. Measured 2026-08-01 on a
# single-council analysis, deriving from Location nodes yielded 3,202 districts, because
# CCOD/OCOD write UK-wide *registered office* addresses into `location`. That allowlist
# passes essentially every PPD row in the country — the multi-million-row load that
# previously wedged SurrealDB. The land-flip detector only correlates PPD transactions with
# planning applications in the analysis's own area, so list just that area's districts.
#
# PLACEHOLDERS: "XX" is not a UK postcode area. Nothing validates the format, so replace
# these with real outward codes (the part of a postcode before the space).
postcode_districts = ["XX1", "XX2", "XX3"]

# ─── Jurisdiction ────────────────────────────────────────────────────────────
# Normally absent. The analysis nation is DERIVED from the ward codes above — the ONS GSS
# prefix names it (E05 England, W05 Wales, S13 Scotland, N08 Northern Ireland) — and the
# startup preflight refuses a configuration that cannot be right for it.
#
# What the derived nation gates:
#   * the deprivation index must belong to the same nation (see [detector] above)
#   * sources with no data for that nation are NOT run, and are counted as
#     skipped_out_of_jurisdiction rather than reported as zero results
#
# HM Land Registry (CCOD, OCOD, Price Paid Data) and the Charity Commission cover England
# and Wales only; Registers of Scotland, Land & Property Services NI, OSCR and CCNI are not
# implemented. CCOD is why the gate refuses rather than warns: it filters rows on
# company_number alone with no geography test, so a Scottish analysis would receive real
# English property for its Scottish companies and land-flip gate-3 would score it as local
# corroboration. Companies House, The Gazette (all editions) and the Electoral Commission
# are UK-wide and unaffected.
#
# [jurisdiction]
# # Explicit nation for an analysis whose scope is not expressed as wards. If wards ARE
# # configured and disagree with this, the config is refused rather than silently resolved.
# nation = "scotland"
# # Permit wards from more than one nation. Off by default: no deprivation index spans two
# # nations, and the England-and-Wales registries would then be right for only part of the
# # corpus. Setting this true leaves the analysis nation unknown, which admits every source.
# allow_mixed_nations = false

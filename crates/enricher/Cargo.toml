[package]
name = "urban-integrity-enricher"
license.workspace = true
version = "0.1.0"
edition = "2021"

[dependencies]
urban-integrity-schema = { path = "../schema" }
urban-integrity-core = { path = "../core" }
urban-integrity-ingestor = { path = "../ingestor" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
surrealdb = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
csv = "1.4.0"
zip = "8.6.0"
sha2 = "0.10"
governor = "0.10"

[dev-dependencies]
urban-integrity-test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
tempfile = "3"
